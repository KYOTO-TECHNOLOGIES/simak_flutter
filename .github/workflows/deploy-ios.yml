name: Deploy iOS to App Store

on:
  push:
    branches:
      - deployiosrizan-cicdios

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install Apple Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/distribution.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temp1234"

          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s \
            $KEYCHAIN_PATH \
            "$HOME/Library/Keychains/login.keychain-db"

          security find-identity -v -p codesigning

      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Configure Xcode signing
        run: |
          /usr/libexec/PlistBuddy -c "Set :objects:13B07F941A680F5B00A75B9A:attributes:TargetAttributes:13B07F951A680F5B00A75B9A:DevelopmentTeam 2X84JN9FPS" ios/Runner.xcodeproj/project.pbxproj || true
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintVerification -bool YES
      - name: Force manual signing in Xcode project
        run: |
          cd ios
          # Change CODE_SIGN_STYLE from Automatic to Manual
          sed -i '' 's|<string>Automatic</string>|<string>Manual</string>|g' Runner.xcodeproj/project.pbxproj
          
          # Add DEVELOPMENT_TEAM after CODE_SIGN_STYLE key
          sed -i '' 's|<key>CODE_SIGN_STYLE</key>|<key>CODE_SIGN_IDENTITY</key>\
          <string>Apple Distribution</string>\
          <key>CODE_SIGN_STYLE</key>|g' Runner.xcodeproj/project.pbxproj

          # Verify
          grep -n "CODE_SIGN_STYLE" Runner.xcodeproj/project.pbxproj
          grep -n "CODE_SIGN_IDENTITY" Runner.xcodeproj/project.pbxproj


      - name: Build IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o $API_KEY_PATH
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key-path $API_KEY_PATH