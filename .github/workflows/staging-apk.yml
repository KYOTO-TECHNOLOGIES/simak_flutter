name: Download Staging Android APK

on:
  push:
    branches:
      - staging/flutter-addons-localization-apk

permissions:
  contents: read

concurrency:
  group: staging-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/staging/flutter-addons-localization-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STAGING_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check Dart errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build staging APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://stage.simakfresh.ae/api/ --build-number=${{ github.run_number }}
      - name: Name download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/simak-staging.apk
      - name: Upload installable APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: simak-staging-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/simak-staging.apk
          if-no-files-found: error
          retention-days: 14
      - name: Show download link
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo '### Staging APK ready' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the Android APK artifact]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract simak-staging.apk from the downloaded ZIP and install on Android.' >> "$GITHUB_STEP_SUMMARY"
