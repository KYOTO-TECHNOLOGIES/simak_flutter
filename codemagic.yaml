workflows:
  ios-workflow:
    name: iOS Workflow

    integrations:
      app_store_connect: Abhi_Codemagic

    environment:
      flutter: stable


    scripts:
      - name: Initialize keychain for private keys
        script: keychain initialize
      - name: Force create missing Apple Certificates and Profiles
        script: app-store-connect fetch-signing-files "com.simakfresh.app" --type IOS_APP_STORE --create
      - name: Save certificates to keychain
        script: keychain add-certificates
      - name: Set up Xcode provisioning profiles
        script: xcode-project use-profiles
      - name: Get dependencies
        script: flutter pub get
      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa