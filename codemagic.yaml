workflows:
  ios-workflow:
    name: iOS Workflow

    integrations:
      app_store_connect: Abhi_Codemagic

    environment:
      flutter: stable

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.simakfresh.app


    scripts:
      - name: Force create missing Apple Certificates and Profiles
        script: app-store-connect fetch-signing-files "com.simakfresh.app" --type IOS_APP_STORE --create
      - name: Set up Xcode provisioning profiles
        script: xcode-project use-profiles
      - name: Get dependencies
        script: flutter pub get
      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa