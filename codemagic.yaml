workflows:
  ios-workflow:
    name: iOS Workflow

    integrations:
      app_store_connect: Abhi_Codemagic

    environment:
      flutter: stable

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.simakfresh.app


    scripts:
      - flutter pub get
      - flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa