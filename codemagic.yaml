workflows:
  ios-workflow:
    name: iOS Workflow

    integrations:
      app_store_connect: Abhi_Codemagic

    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.simakfresh.app

    scripts:
      - name: Set up Xcode provisioning profiles
        script: xcode-project use-profiles
      - name: Get dependencies
        script: flutter pub get
      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true